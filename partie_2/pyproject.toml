[project]
name = "proplog"
version = "0.1.0"
description = "Compilateur d'un langage de contraintes vers SAT"
readme = "README.md"
authors = [
    { name = "martinp2003-debug", email = "martin.potier@student-cs.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "lark>=1.0",
]

[project.scripts]
proplog = "proplog:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
